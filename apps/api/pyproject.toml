[project]
name = "research-agent-backend"
version = "0.1.0"
description = "Python backend for the Multi-Step Research Agent dashboard."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "httpx>=0.27.0",
  "PyJWT[crypto]>=2.8.0",
  "argon2-cffi>=23.1.0",
  "python-multipart>=0.0.9",
  "SQLAlchemy>=2.0.31",
  "psycopg[binary]>=3.2.1",
  "alembic>=1.13.2",
  "upstash-redis>=1.2.0",
  "azure-storage-blob>=12.22.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.5.0",
]

[tool.ruff]
line-length = 110
target-version = "py311"
